apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// Apply React Native plugin only if node_modules exists
def nodeModulesExists = file("../../node_modules").exists()
if (nodeModulesExists) {
    apply plugin: "com.facebook.react"

    react {
        /* Folders */
        root = file("../../")
        reactNativeDir = file("../../node_modules/react-native")
        codegenDir = file("../../node_modules/@react-native/codegen")
        appCodegenDir = file("build/generated/rncli")
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "25.1.8937393"

    namespace "com.perpetualtrading"

    defaultConfig {
        applicationId "com.perpetualtrading"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    if (nodeModulesExists) {
        implementation("com.facebook.react:react-android")

        // Use Hermes engine (default for React Native 0.70+)
        def useHermes = project.findProperty('hermesEnabled')?.toBoolean() ?: true
        if (useHermes) {
            implementation("com.facebook.react:hermes-android")
        } else {
            implementation jscFlavor
        }

        debugImplementation("com.facebook.flipper:flipper:0.182.0")
        debugImplementation("com.facebook.flipper:flipper-network-plugin:0.182.0") {
            exclude group:'com.squareup.okhttp3', module:'okhttp'
        }

        debugImplementation("com.facebook.flipper:flipper-fresco-plugin:0.182.0")
        androidTestImplementation('com.wix:detox:+')
    }

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
